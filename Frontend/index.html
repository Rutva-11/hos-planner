    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Color Scheme & Theme Initialization Script to Prevent FOUC -->
    <meta name="color-scheme" content="light dark">
    <script>
      (function() {
        const storedTheme = localStorage.getItem('theme-preference');
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="color-scheme"]').content = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.querySelector('meta[name="color-scheme"]').content = 'light';
        }
      })();
    </script>
  </head>
  <body class="bg-luxury-ivory-50 dark:bg-luxury-charcoal-800 text-luxury-charcoal-700 dark:text-luxury-charcoal-100 transition-colors duration-500 ease-in-out antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
